# Hyprland >= 0.56 hyprlang config (snake_case rule grammar).
windowrule = float true, match:class ^(hypr-uac)$
windowrule = center true, match:class ^(hypr-uac)$
windowrule = pin true, match:class ^(hypr-uac)$
windowrule = dim_around true, match:class ^(hypr-uac)$
