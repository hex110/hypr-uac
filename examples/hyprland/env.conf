# Only needed when Hyprland is NOT started through systemd (uwsm): then it
# never sees ~/.config/environment.d, and neither does anything it launches.
# hypr-uac-doctor says whether you need this. Use your real home directory
# (and ASKPASS_DIR, if you changed it).
env = SUDO_ASKPASS,/home/YOU/.local/bin/hypr-askpass
env = SSH_ASKPASS,/home/YOU/.local/bin/hypr-askpass
